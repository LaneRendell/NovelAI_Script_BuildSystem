name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the repo. The GITHUB_TOKEN gets no
# write scopes, so a malicious PR can't use it to push, comment, or release.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Do not auto-run PRs opened from forks. Same-repo branches (maintainers) and
    # pushes to main run automatically; fork PRs are skipped until a maintainer
    # runs them deliberately (e.g. by pushing the branch to this repo). For defence
    # in depth, also set Settings → Actions → "Fork pull request workflows from
    # outside collaborators" to require approval.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
